name: Maren
options:
  bundleIdPrefix: finance.maren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # DEVELOPMENT_TEAM is intentionally empty at the PROJECT level so simulator Debug builds
    # and CI test runs need no Apple team and no signing at all. The real team is set on the
    # Maren target's Release config below, which is the only configuration that signs.
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    # Marketing version (CFBundleShortVersionString) and build number (CFBundleVersion).
    # Bump CURRENT_PROJECT_VERSION for every new TestFlight upload of the same 1.0.0.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

# The real Mezo chain layer is built on argentlabs/web3.swift — a maintained Swift EVM
# library that gives us keccak256, ABI encoding, secp256k1 signing, EIP-712 TypedData and a
# JSON-RPC HTTP client. No crypto is hand-rolled. See Maren/Chain/.
packages:
  web3.swift:
    url: https://github.com/argentlabs/web3.swift
    # 2.0.0 declares swift-tools 6.1 (needs Xcode 16.3+); this repo builds on Xcode 16.2 /
    # Swift 6.0, so the 1.6.x line is the newest that resolves here. Pinned to a minor range.
    minorVersion: "1.6.1"
  # BigInt is web3.swift's own transitive dependency; declared explicitly so the app and test
  # modules may `import BigInt` and name `BigUInt` directly. Same 5.x line web3.swift resolves.
  BigInt:
    url: https://github.com/attaswift/BigInt
    from: "5.3.0"
  # web3.swift 1.6.1 requires the `secp256k1` PRODUCT from GigaBitcoin/secp256k1.swift, but
  # that package renamed it to `libsecp256k1` at 0.20.0. Its own dependency range
  # (upToNextMajor from 0.6.0) would otherwise resolve to 0.21.x and fail the graph, so it is
  # pinned to the last version that still ships the `secp256k1` product.
  secp256k1.swift:
    url: https://github.com/GigaBitcoin/secp256k1.swift.git
    exactVersion: "0.18.0"

targets:
  Maren:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Maren
        excludes:
          - Info.plist
          - Maren.entitlements
    dependencies:
      - package: web3.swift
        product: web3.swift
      - package: BigInt
        product: BigInt
    settings:
      base:
        # Production reverse-DNS bundle identifier. (Internal Keychain service labels in
        # Keystore.swift / MarenSession.swift are independent string constants and keep their
        # historical "finance.maren.swift" value — they are cosmetic labels, unrelated to the
        # bundle id or the keychain access group, so no code change is required.)
        PRODUCT_BUNDLE_IDENTIFIER: finance.maren.app
        # Partial Info.plist for custom keys (MAREN_RELAYER_URL, ITSAppUsesNonExemptEncryption);
        # GENERATE_INFOPLIST_FILE still merges the INFOPLIST_KEY_* Apple keys below into it at
        # build time.
        INFOPLIST_FILE: Maren/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        # The biometric Keychain item (Keystore.swift) can only be read with a keychain-access
        # entitlement; without it the read fails with errSecMissingEntitlement (-34018). Ad-hoc
        # signing ("-") applies the entitlement on the simulator with no team (Debug); a real
        # device / distribution build uses automatic signing with the team (Release, below).
        CODE_SIGN_ENTITLEMENTS: Maren/Maren.entitlements
        CODE_SIGNING_ALLOWED: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Maren
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        # iPhone only. Maren is a portrait phone app, and App Store validation rejects a
        # UNIVERSAL (iPhone+iPad) bundle that declares portrait alone: an iPad build must
        # offer all four orientations for multitasking. Declaring the family honestly is the
        # fix; padding the orientation list would ship an app whose layouts assume portrait.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSFaceIDUsageDescription: Maren uses Face ID to unlock your signing key before every transaction, so only you can move your money.
        INFOPLIST_KEY_NSCameraUsageDescription: Maren uses the camera only to scan Maren payment and claim QR codes. Nothing is recorded or uploaded.
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Debug: ad-hoc signing ("-") so the Simulator build + tests run with no Apple team.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
        # Release: MANUAL signing against the App Store profile, for a device / TestFlight
        # archive. These live here, on the app TARGET, and must never be passed to xcodebuild
        # as command-line build settings: command-line settings apply to every target in the
        # graph, including the SwiftPM dependencies, and the archive then dies with
        # "swift-nio_NIOPosix does not support provisioning profiles, but provisioning
        # profile ... has been manually specified". A framework target cannot take a profile.
        #
        # Manual rather than automatic because CI signs with an explicitly installed profile:
        # automatic signing needs an App Store Connect key with the ADMIN role, and a runner
        # doing cloud signing mints a new distribution certificate on every run against a
        # team limit of three. PROVISIONING_PROFILE_SPECIFIER matches the profile the
        # workflow installs by name; the workflow asserts the two agree before archiving.
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: "5N8DU2A9WH"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Maren AppStore v1"
          CODE_SIGNING_REQUIRED: "YES"

  MarenTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MarenTests
    dependencies:
      # Hosted in the Maren app process: the app already links web3.swift and its SwiftNIO
      # transitive frameworks, so the test bundle resolves those symbols from the host via
      # BUNDLE_LOADER rather than re-linking the package product itself (which fails to pull
      # in NIO when built standalone). `embed: false, link: false` keeps the products on the
      # compile-time module search path (so `import web3` / `import BigInt` resolve) without
      # re-linking them into the test bundle.
      - target: Maren
      - package: web3.swift
        product: web3.swift
        embed: false
        link: false
      - package: BigInt
        product: BigInt
        embed: false
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: finance.maren.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maren.app/Maren"
        BUNDLE_LOADER: "$(TEST_HOST)"
