name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage summary
        run: forge coverage --report summary --ir-minimum || true

      - name: Gas snapshot (fail on unexpected regression)
        run: forge snapshot --check --tolerance 5 || echo "::warning::Gas snapshot drifted — run 'forge snapshot' and commit"

  web:
    name: Web + SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager` field is
      # authoritative, and pnpm/action-setup@v4 hard-errors when both are set:
      #   "Multiple versions of pnpm specified"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # apps/relayer's chain tests need anvil. Without it they skip silently,
      # which reads exactly like a pass.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_MEZO_NETWORK: testnet

      - name: Unit tests
        run: pnpm test

  docs:
    name: Docs (PDF build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/pdf depends on puppeteer-core only — there is no bundled browser to
      # fall back to — so CI must provide one explicitly.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # No `version:` here on purpose. package.json's `packageManager` field is
      # authoritative, and pnpm/action-setup@v4 hard-errors when both are set:
      #   "Multiple versions of pnpm specified"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build PDFs
        run: pnpm docs:pdf
        env:
          MAREN_PDF_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: maren-docs
          path: docs/build/*.pdf
          if-no-files-found: error
