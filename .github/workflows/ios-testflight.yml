# Maren iOS: test, archive, and upload to TestFlight.
#
# WHY THIS EXISTS SEPARATELY FROM ci.yml
#
# `ci.yml` runs on ubuntu and covers the TypeScript workspaces and the contracts. It does
# not touch `apps/ios-native` at all, because building it needs a macOS runner (which bills
# at 10x the Linux rate). So the native app gets its own workflow, and it is deliberately
# NOT on every push:
#
#   - `pull_request` touching apps/ios-native  -> test only. No signing, no secrets, no
#     upload. This is the gate that stops a red iOS build reaching main, and it works on a
#     fork PR because it needs nothing privileged.
#   - `workflow_dispatch`                       -> test, archive, and upload to TestFlight.
#     Shipping a build is a decision someone makes, not something a merge does by accident.
#
# THE BUILD NUMBER IS `github.run_number`, NOT the value in project.yml. App Store Connect
# rejects a duplicate build number for the same marketing version, and the surest way to
# hit that is a human editing a file. The run number is monotonic and unique per workflow,
# so every upload is accepted. `manageAppVersionAndBuildNumber` is false in
# ExportOptions.plist, so Xcode will not silently rewrite what we set here.
#
# WHY macos-26 AND AN SDK GATE. Apple rejects any App Store Connect upload whose binary was
# built with an SDK older than iOS 26 ("This app was built with the iOS 18.2 SDK. All iOS and
# iPadOS apps must be built with the iOS 26 SDK or later"). That is checked server-side on the
# built binary, so no build flag works around it, and it is the reason this workflow exists
# rather than a laptop upload: the dev machine had Xcode 16.2. The Xcode path is deliberately
# NOT pinned (image updates move those); the upload job asserts the SDK instead.
#
# SIGNING IS FULLY MANUAL. Both the distribution certificate and the App Store provisioning
# profile come from secrets. Cloud signing (`-allowProvisioningUpdates`) was tried and fails
# with "Cloud signing permission error / No profiles for 'finance.maren.app' were found"
# unless the App Store Connect key holds the ADMIN role, which this one does not (it can read
# provisioning data but not create signing assets). Manual signing is also better for CI on
# its own merits: a runner doing cloud signing mints a NEW distribution certificate on every
# run, and a team may only hold three.
#
# REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#
#   IOS_DIST_CERT_P12          Apple Distribution certificate + private key, exported from
#                              Keychain Access as .p12, then `base64 -i cert.p12 | pbcopy`.
#   IOS_DIST_CERT_PASSWORD     The password chosen during that .p12 export.
#   IOS_PROVISION_PROFILE      The App Store .mobileprovision for finance.maren.app, base64.
#                              Must reference the same certificate as the .p12 above.
#   APP_STORE_CONNECT_KEY_ID   App Store Connect -> Users and Access -> Integrations -> Keys.
#   APP_STORE_CONNECT_ISSUER_ID  The issuer UUID shown above the key list on that page.
#   APP_STORE_CONNECT_API_KEY  Contents of the downloaded AuthKey_XXXXXXXX.p8, base64:
#                              `base64 -i AuthKey_XXXXXXXX.p8 | pbcopy`. Apple lets you
#                              download it exactly once.
#
# The App Store Connect key needs the App Manager role to upload builds.
# The Team ID is NOT a secret and lives in project.yml / ExportOptions.plist.

name: iOS TestFlight

on:
  pull_request:
    paths:
      - 'apps/ios-native/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the build to TestFlight (unchecked = archive only, useful for a dry run)'
        type: boolean
        default: true
      whats_new:
        description: 'Optional "What to Test" note for this TestFlight build'
        type: string
        required: false

concurrency:
  # Two uploads racing would burn build numbers and could interleave in App Store Connect.
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCHEME: Maren
  PROJECT: apps/ios-native/Maren.xcodeproj
  # Matches project.yml's deploymentTarget of 17.0; bump both together.
  SIMULATOR: 'platform=iOS Simulator,name=iPhone 16 Pro'

jobs:
  test:
    name: Test (simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, not committed, so it cannot drift from project.yml.
      - name: Generate project
        working-directory: apps/ios-native
        run: xcodegen generate

      # No signing here on purpose: the Debug config sets CODE_SIGNING_REQUIRED=NO, so this
      # job runs on a fork PR with no access to secrets.
      - name: Test
        working-directory: apps/ios-native
        run: |
          set -o pipefail
          xcodebuild test \
            -project Maren.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      # A Release build compiles code that Debug does not: it is what proves the DEBUG-only
      # demo/stub types are genuinely excluded from a shipping binary. Cheap, and it catches
      # the failure at PR time instead of at archive time.
      - name: Release build (simulator, unsigned)
        working-directory: apps/ios-native
        run: |
          set -o pipefail
          xcodebuild build \
            -project Maren.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      # The reason the DEBUG gating exists at all: no fabricated data may reach a user.
      # Assert it on the artifact rather than trusting that the gates were written correctly.
      - name: Assert no fabricated data in the Release binary
        run: |
          BIN=$(find ~/Library/Developer/Xcode/DerivedData \
                -path '*Release-iphonesimulator/Maren.app/Maren' -print -quit)
          if [ -z "$BIN" ]; then echo "::error::Release binary not found"; exit 1; fi
          fail=0
          for s in 0xDEMO @demo 0xdemo StubMarenClient DemoMarenActions MAREN_DEMO MAREN_SCREEN; do
            n=$(strings "$BIN" | grep -cF "$s" || true)
            echo "$s: $n"
            [ "$n" -eq 0 ] || { echo "::error::'$s' is present in the Release binary"; fail=1; }
          done
          exit $fail

  testflight:
    name: Archive and upload
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Apple rejects the upload SERVER-SIDE if this is below 26, and only after a full
      # archive has already run: "This app was built with the iOS 18.2 SDK. All iOS and
      # iPadOS apps must be built with the iOS 26 SDK or later." No build flag works around
      # it, so assert the toolchain in seconds rather than discover it in minutes. The Xcode
      # path is deliberately not pinned: image updates move those, and the SDK is what Apple
      # actually checks.
      - name: Require the iOS 26 SDK or later
        run: |
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "highest iphoneos SDK: ${SDK:-none}"
          if [ -z "$SDK" ] || [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::App Store uploads require the iOS 26 SDK or later; this runner has ${SDK:-none}."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apps/ios-native
        run: xcodegen generate

      # A dedicated keychain, unlocked for this job only. `set +x` around the secrets so a
      # future `set -x` for debugging cannot echo the certificate password into the log.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set +x
          if [ -z "$CERT_P12" ]; then
            echo "::error::IOS_DIST_CERT_P12 is not set. See the header of this workflow."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/maren-signing.keychain-db"
          # Random, single-use, and never leaves the runner.
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "Identities in the signing keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Cloud signing (-allowProvisioningUpdates) needs an App Store Connect key with the
      # ADMIN role; a lesser key fails with "Cloud signing permission error / No profiles for
      # 'finance.maren.app' were found" even though it can read provisioning data fine. So the
      # profile is supplied explicitly. That is also better for CI on its own merits: a runner
      # doing cloud signing mints a NEW distribution certificate every run, and a team may
      # only hold three.
      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set +x
          if [ -z "$PROFILE" ]; then
            echo "::error::IOS_PROVISION_PROFILE is not set. See the header of this workflow."
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PLIST=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
          NAME=$(echo "$PLIST" | plutil -extract Name raw -)
          APPID=$(echo "$PLIST" | plutil -extract Entitlements.application-identifier raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "profile: $NAME ($UUID) for $APPID"
          # A profile for the wrong app id produces an archive Apple then rejects.
          case "$APPID" in
            *finance.maren.app) : ;;
            *) echo "::error::profile is for $APPID, expected *.finance.maren.app"; exit 1 ;;
          esac
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set +x
          if [ -z "$ASC_KEY" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::error::App Store Connect API key secrets are not set. See the header."
            exit 1
          fi
          # altool looks in ~/.appstoreconnect/private_keys for AuthKey_<id>.p8.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # project.yml holds the marketing version (1.0.0). The build number comes from the run
      # number so it is unique without anyone remembering to bump a file.
      - name: Archive
        working-directory: apps/ios-native
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Maren.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maren.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=5N8DU2A9WH \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export ipa
        working-directory: apps/ios-native
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>5N8DU2A9WH</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>finance.maren.app</key><string>${PROFILE_NAME}</string></dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Maren.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" | xcpretty && exit ${PIPESTATUS[0]}
          ls -la "$RUNNER_TEMP/export"

      # Kept even when the upload is skipped, so a dry run still produces something you can
      # install manually and inspect.
      - name: Upload the .ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maren-ipa-build-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA (build ${{ github.run_number }})"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Maren iOS build ${{ github.run_number }}"
            echo ""
            echo "- Marketing version: from project.yml (1.0.0)"
            echo "- Build number: ${{ github.run_number }}"
            echo "- Uploaded to TestFlight: ${{ inputs.upload }}"
            if [ -n "${{ inputs.whats_new }}" ]; then
              echo "- What to test: ${{ inputs.whats_new }}"
            fi
            echo ""
            echo "Processing takes a few minutes in App Store Connect before the build"
            echo "appears in TestFlight. Export compliance is pre-answered by"
            echo "ITSAppUsesNonExemptEncryption=false in Info.plist."
          } >> "$GITHUB_STEP_SUMMARY"

      # Runners are ephemeral, but an explicit teardown means a future change to a
      # self-hosted runner cannot leave a signing identity behind.
      - name: Clean up secrets on the runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/maren-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/profile.mobileprovision"
